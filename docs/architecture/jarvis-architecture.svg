<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis private voice architecture with n8n orchestration</title>
  <desc id="desc">Browser and Amazfit Active Max clients reach a session-controlled Jarvis API over private HTTPS. The API normalizes audio through private speech recognition, sends a typed transcript to an authenticated n8n workflow, validates the typed response, synthesizes speech with Piper, and returns text and audio to the owning session. n8n validates input, calls a private local model, normalizes output, and retains no execution data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020806"/>
      <stop offset="0.55" stop-color="#06110b"/>
      <stop offset="1" stop-color="#010503"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1d12"/>
      <stop offset="1" stop-color="#050c08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#173522" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4dff88"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a7f3c5"/>
    </marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b7ff5a"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:12px;font-weight:800;letter-spacing:2.2px}
      .title{font-size:19px;font-weight:760;fill:#f1fff5}
      .sub{font-size:12.5px;fill:#a8c5b1}
      .tiny{font-size:10.5px;fill:#7fa18a}
      .node{fill:url(#panel);stroke:#2a7041;stroke-width:1.4}
      .flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
      .flow-label{font-size:10px;font-weight:800;letter-spacing:.7px;fill:#d9ffe5}
      .pill{fill:#06110b;stroke:#275c38;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1110" cy="420" r="420" fill="#20f36b" opacity="0.025"/>
  <circle cx="700" cy="480" r="310" fill="#4dff88" opacity="0.022"/>

  <g class="sans">
    <text x="60" y="57" fill="#4dff88" class="eyebrow">JARVIS / RELEASE ARCHITECTURE</text>
    <text x="60" y="95" fill="#f1fff5" font-size="31" font-weight="780">Private voice assistant with typed n8n orchestration</text>
    <text x="60" y="122" fill="#89a994" font-size="14">One bounded media path, one authenticated workflow boundary, zero public ingress.</text>
    <g transform="translate(1260 52)">
      <rect width="280" height="52" rx="26" fill="#07140c" stroke="#4dff88" stroke-width="1.2"/>
      <circle cx="25" cy="26" r="5" fill="#4dff88" filter="url(#glow)"/>
      <text x="44" y="23" fill="#e6ffed" font-size="12" font-weight="800">PRIVATE LAN</text>
      <text x="44" y="40" fill="#789783" font-size="10.5">NO PUBLIC OR CLIENT TOOL ACCESS</text>
    </g>
  </g>

  <rect x="38" y="150" width="1524" height="730" rx="22" fill="#041009" fill-opacity="0.52" stroke="#3adf70" stroke-width="1.25" stroke-dasharray="10 8"/>
  <g class="mono">
    <rect x="62" y="136" width="181" height="28" rx="14" fill="#06110b" stroke="#3adf70"/>
    <text x="83" y="155" fill="#8effae" font-size="11" font-weight="800" letter-spacing="1.2">CURRENT SYSTEM</text>
  </g>

  <!-- Connections render behind opaque nodes. -->
  <g aria-label="Jarvis data flows">
    <path class="flow" d="M345 277H435" stroke="#4dff88" marker-end="url(#arrow-green)"/>
    <path class="flow" d="M435 315H345" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
    <path class="flow" d="M345 557H405" stroke="#b7ff5a" marker-end="url(#arrow-lime)"/>
    <path class="flow" d="M405 595H345" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
    <path class="flow" d="M685 557V460Q685 440 665 440H575Q555 440 555 410" stroke="#b7ff5a" marker-end="url(#arrow-lime)"/>
    <path class="flow" d="M525 410V470Q525 490 545 490H650Q665 490 665 510" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
    <path class="flow" d="M645 282H720" stroke="#4dff88" marker-end="url(#arrow-green)"/>
    <path class="flow" d="M720 322H645" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>

    <path class="flow" d="M830 520V652H734" stroke="#4dff88" marker-end="url(#arrow-green)"/>
    <path class="flow" d="M734 705H790Q815 705 815 680V520" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
    <path class="flow" d="M900 520V652H973" stroke="#4dff88" marker-end="url(#arrow-green)"/>
    <path class="flow" d="M973 705H935Q915 705 915 680V520" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>

    <path class="flow" d="M980 305H1045" stroke="#b7ff5a" marker-end="url(#arrow-lime)"/>
    <path class="flow" d="M1045 350H980" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
    <path class="flow" d="M1288 575V650" stroke="#b7ff5a" marker-end="url(#arrow-lime)"/>
    <path class="flow" d="M1335 650V575" stroke="#a7f3c5" marker-end="url(#arrow-mint)"/>
  </g>

  <g class="mono">
    <g transform="translate(357 261)"><rect class="pill" width="66" height="24" rx="12"/><text x="33" y="16.5" text-anchor="middle" class="flow-label">HTTPS</text></g>
    <g transform="translate(352 540)"><rect class="pill" width="49" height="24" rx="12"/><text x="24.5" y="16.5" text-anchor="middle" class="flow-label">BLE</text></g>
    <g transform="translate(575 430)"><rect class="pill" width="109" height="24" rx="12"/><text x="54.5" y="16.5" text-anchor="middle" class="flow-label">LAN RELAY</text></g>
    <g transform="translate(650 265)"><rect class="pill" width="64" height="24" rx="12"/><text x="32" y="16.5" text-anchor="middle" class="flow-label">V1 API</text></g>
    <g transform="translate(990 287)"><rect class="pill" width="50" height="24" rx="12"/><text x="25" y="16.5" text-anchor="middle" class="flow-label">JSON</text></g>
  </g>

  <g class="sans" filter="url(#shadow)">
    <g transform="translate(75 220)">
      <rect class="node" width="270" height="135" rx="13"/>
      <rect x="1" y="1" width="268" height="36" rx="12" fill="#0d2817"/>
      <circle cx="20" cy="19" r="4" fill="#4dff88"/><circle cx="35" cy="19" r="4" fill="#245f38"/><circle cx="50" cy="19" r="4" fill="#245f38"/>
      <text x="20" y="67" class="title">Browser cockpit</text>
      <text x="20" y="91" class="sub">Hold-to-Talk · Open Dialogue</text>
      <text x="20" y="113" class="sub">Typed requests · responsive UI</text>
    </g>

    <g transform="translate(435 220)">
      <rect width="210" height="190" rx="13" fill="#101b10" stroke="#b7ff5a" stroke-width="1.5"/>
      <path d="M24 38h28M24 48h19M24 58h24" stroke="#b7ff5a" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="46" class="title">Private ingress</text>
      <text x="68" y="67" fill="#d8ff9d" font-size="11" font-weight="800">CADDY / HTTPS</text>
      <line x1="20" y1="87" x2="190" y2="87" stroke="#375126"/>
      <text x="20" y="114" class="sub">Same-origin web + API</text>
      <text x="20" y="137" class="sub">Origin and route controls</text>
      <text x="20" y="163" fill="#98b878" font-size="11">No Internet-facing route</text>
    </g>

    <g transform="translate(75 510)">
      <rect class="node" width="270" height="135" rx="13"/>
      <rect x="20" y="25" width="44" height="71" rx="16" fill="#07110b" stroke="#7dffa6"/>
      <circle cx="42" cy="60" r="14" fill="#0d3d22" stroke="#4dff88"/>
      <text x="83" y="46" class="title">Amazfit Active Max</text>
      <text x="83" y="69" fill="#8effae" font-size="11" font-weight="800">ZEPP OS DEVICE APP</text>
      <text x="83" y="96" class="sub">OPUS voice capture</text>
      <text x="83" y="117" class="sub">Response text + audio</text>
    </g>

    <g transform="translate(405 510)">
      <rect class="node" width="280" height="135" rx="13"/>
      <rect x="21" y="25" width="35" height="64" rx="8" fill="#07110b" stroke="#7dffa6"/>
      <circle cx="38.5" cy="82" r="2.3" fill="#4dff88"/>
      <text x="75" y="47" class="title">Zepp phone bridge</text>
      <text x="75" y="69" fill="#8effae" font-size="11" font-weight="800">SIDE SERVICE</text>
      <text x="21" y="104" class="sub">Chunked paired-device transfer</text>
      <text x="21" y="124" class="sub">Scoped relay to the same v1 API</text>
    </g>

    <g transform="translate(720 220)">
      <rect width="260" height="300" rx="15" fill="#071c10" stroke="#4dff88" stroke-width="1.8"/>
      <rect x="13" y="13" width="234" height="274" rx="11" fill="none" stroke="#68d68a" stroke-width="1.1" stroke-dasharray="5 5"/>
      <path d="M28 43l12-7 12 7v14c0 10-8 17-12 19-4-2-12-9-12-19z" fill="none" stroke="#8effae" stroke-width="1.8"/>
      <text x="67" y="49" class="title">Jarvis API</text>
      <text x="28" y="92" fill="#8effae" font-size="10.5" font-weight="800" letter-spacing=".8">SESSION + MEDIA BOUNDARY</text>
      <line x1="28" y1="110" x2="232" y2="110" stroke="#245f38"/>
      <text x="28" y="140" class="sub">Session ownership · CSRF</text>
      <text x="28" y="164" class="sub">Rate, size and duration bounds</text>
      <text x="28" y="188" class="sub">Audio normalization · policy gate</text>
      <text x="28" y="212" class="sub">Exact n8n response validation</text>
      <text x="28" y="236" class="sub">Turn cancellation · audio scope</text>
      <rect x="28" y="256" width="168" height="19" rx="9.5" fill="#0d3d22"/>
      <text x="112" y="269.5" text-anchor="middle" fill="#8effae" font-size="9.5" font-weight="800">EPHEMERAL TURN STATE</text>
    </g>

    <g transform="translate(575 652)">
      <rect class="node" width="160" height="106" rx="12"/>
      <text x="18" y="36" class="title">Whisper</text>
      <text x="18" y="60" fill="#8effae" font-size="11" font-weight="800">SPEECH → TEXT</text>
      <text x="18" y="83" class="tiny">Private STT service</text>
    </g>

    <g transform="translate(973 652)">
      <rect class="node" width="160" height="106" rx="12"/>
      <text x="18" y="36" class="title">Piper</text>
      <text x="18" y="60" fill="#8effae" font-size="11" font-weight="800">TEXT → SPEECH</text>
      <text x="18" y="83" class="tiny">Pinned local voice</text>
    </g>

    <g transform="translate(1045 182)">
      <rect width="470" height="393" rx="16" fill="#08170e" stroke="#b7ff5a" stroke-width="1.7"/>
      <rect x="18" y="-13" width="205" height="28" rx="14" fill="#0b1b10" stroke="#b7ff5a"/>
      <text x="120" y="6" text-anchor="middle" fill="#dcffa9" font-size="10.5" font-weight="850" letter-spacing="1">N8N WORKFLOW</text>
      <text x="24" y="48" class="title">Authenticated reasoning orchestration</text>
      <text x="24" y="72" class="sub">Typed transcript in · typed spoken response out</text>

      <g transform="translate(24 104)">
        <rect width="198" height="72" rx="10" fill="#102112" stroke="#84c64b"/>
        <text x="16" y="28" fill="#efffdb" font-size="13" font-weight="760">1 · Auth webhook</text>
        <text x="16" y="51" class="tiny">Bearer + idempotency key</text>
      </g>
      <g transform="translate(248 104)">
        <rect width="198" height="72" rx="10" fill="#102112" stroke="#84c64b"/>
        <text x="16" y="28" fill="#efffdb" font-size="13" font-weight="760">2 · Validate turn</text>
        <text x="16" y="51" class="tiny">Exact keys, IDs and bounds</text>
      </g>
      <g transform="translate(24 197)">
        <rect width="198" height="72" rx="10" fill="#102112" stroke="#84c64b"/>
        <text x="16" y="28" fill="#efffdb" font-size="13" font-weight="760">4 · Normalize</text>
        <text x="16" y="51" class="tiny">Versioned response envelope</text>
      </g>
      <g transform="translate(248 197)">
        <rect width="198" height="72" rx="10" fill="#102112" stroke="#84c64b"/>
        <text x="16" y="28" fill="#efffdb" font-size="13" font-weight="760">3 · Call model</text>
        <text x="16" y="51" class="tiny">No tools · bounded output</text>
      </g>
      <path d="M222 140H244M347 176V193M244 233H226" fill="none" stroke="#b7ff5a" stroke-width="1.8" marker-end="url(#arrow-lime)"/>
      <line x1="24" y1="303" x2="446" y2="303" stroke="#2f4a28"/>
      <circle cx="32" cy="336" r="4" fill="#4dff88" filter="url(#glow)"/>
      <text x="47" y="340" fill="#b9d7c0" font-size="11.5">Execution data saving disabled</text>
      <circle cx="258" cy="336" r="4" fill="#4dff88"/>
      <text x="273" y="340" fill="#b9d7c0" font-size="11.5">No tools or memory</text>
      <text x="24" y="372" fill="#789783" font-size="10.5">Workflow fails closed on malformed input or output.</text>
    </g>

    <g transform="translate(1160 650)">
      <rect class="node" width="300" height="108" rx="12"/>
      <circle cx="42" cy="41" r="17" fill="#0d3d22" stroke="#4dff88"/>
      <path d="M32 41h20M42 31v20" stroke="#a7f3c5" stroke-width="2" stroke-linecap="round"/>
      <text x="75" y="38" class="title">Private local model</text>
      <text x="75" y="61" fill="#8effae" font-size="11" font-weight="800">OPENAI-COMPATIBLE ENDPOINT</text>
      <text x="22" y="88" class="sub">Concise, non-tool response generation</text>
    </g>
  </g>

  <g class="mono" transform="translate(60 917)">
    <text x="0" y="0" fill="#789783" font-size="10.5" font-weight="800" letter-spacing="1.4">FLOW LEGEND</text>
    <g transform="translate(0 21)"><line x1="0" y1="10" x2="43" y2="10" stroke="#4dff88" stroke-width="2.2" marker-end="url(#arrow-green)"/><text x="57" y="14" fill="#b9d7c0" font-size="11">request / audio / transcript</text></g>
    <g transform="translate(310 21)"><line x1="0" y1="10" x2="43" y2="10" stroke="#a7f3c5" stroke-width="2.2" marker-end="url(#arrow-mint)"/><text x="57" y="14" fill="#b9d7c0" font-size="11">validated text / audio response</text></g>
    <g transform="translate(670 21)"><line x1="0" y1="10" x2="43" y2="10" stroke="#b7ff5a" stroke-width="2.2" marker-end="url(#arrow-lime)"/><text x="57" y="14" fill="#b9d7c0" font-size="11">paired or authenticated hop</text></g>
  </g>

  <line x1="60" y1="972" x2="1540" y2="972" stroke="#173522"/>
  <text x="60" y="991" class="mono" fill="#698875" font-size="10.5">TURN-SCOPED AUDIO · STRICT CONTRACTS · ZERO N8N EXECUTION RETENTION</text>
  <text x="1540" y="991" text-anchor="end" class="mono" fill="#698875" font-size="10.5">CURRENT REFERENCE DEPLOYMENT</text>
</svg>
