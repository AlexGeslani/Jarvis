<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis private LAN voice assistant architecture</title>
  <desc id="desc">Current Jarvis architecture showing browser and Amazfit watch clients, the Zepp phone side service and paired-device bridge, private LAN ingress through Caddy, the Jarvis API session and safety boundary, local Whisper speech recognition and Piper speech synthesis, and an authenticated local reasoning service. Response paths return to browser and watch. Home Assistant is shown only as a dashed future integration. The system has no public ingress and handles voice ephemerally.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#162238" stroke-width="1" opacity="0.52"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#07111f"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000814" flood-opacity="0.7"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a78bfa"/>
    </marker>
    <style>
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:2.4px}
      .node-title{font-size:18px;font-weight:700;fill:#f8fafc}
      .node-sub{font-size:12.5px;fill:#b9c7d9}
      .tiny{font-size:11px;fill:#8fa3ba}
      .flow{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
      .flow-label{font-size:11px;font-weight:700;letter-spacing:.5px;fill:#d9faff}
      .pill{fill:#071321;stroke:#244058;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <rect width="1600" height="1050" fill="url(#grid)"/>
  <circle cx="1230" cy="160" r="260" fill="#0891b2" opacity="0.035"/>
  <circle cx="640" cy="560" r="360" fill="#7c3aed" opacity="0.028"/>

  <!-- Header -->
  <g class="sans">
    <text x="60" y="58" fill="#22d3ee" class="eyebrow">JARVIS / SYSTEM VIEW</text>
    <text x="60" y="94" fill="#f8fafc" font-size="30" font-weight="750">Private, local-first voice architecture</text>
    <text x="60" y="120" fill="#8fa3ba" font-size="14">Browser and wearable clients share one session-controlled response path.</text>
    <g transform="translate(1264 54)">
      <rect width="276" height="50" rx="25" fill="#0a1823" stroke="#22d3ee" stroke-width="1.2"/>
      <circle cx="25" cy="25" r="5" fill="#22d3ee" filter="url(#glow)"/>
      <text x="43" y="22" fill="#e6fbff" font-size="12" font-weight="700">LAN ONLY</text>
      <text x="43" y="38" fill="#8fa3ba" font-size="10.5">NO PUBLIC INGRESS</text>
    </g>
  </g>

  <!-- LAN and current-system boundaries -->
  <rect x="40" y="145" width="1520" height="725" rx="20" fill="#06101d" fill-opacity="0.48" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="10 8"/>
  <g class="mono">
    <rect x="62" y="130" width="166" height="29" rx="14.5" fill="#06101d" stroke="#22d3ee"/>
    <text x="82" y="149" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.2">PRIVATE LAN</text>
    <rect x="62" y="177" width="1470" height="515" rx="15" fill="none" stroke="#334155" stroke-width="1.2"/>
    <rect x="82" y="164" width="172" height="27" rx="13.5" fill="#07111f" stroke="#334155"/>
    <text x="101" y="182" fill="#cbd5e1" font-size="10.5" font-weight="700" letter-spacing="1">CURRENT SYSTEM</text>
  </g>

  <!-- Connections are deliberately drawn before opaque nodes. -->
  <g aria-label="Current data flows">
    <!-- Browser to ingress and back -->
    <path class="flow" d="M370 287H465" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
    <path class="flow" d="M465 323H370" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- Ingress to API and back -->
    <path class="flow" d="M745 287H825" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
    <path class="flow" d="M825 323H745" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- Watch paired bridge -->
    <path class="flow" d="M370 545H455" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
    <path class="flow" d="M455 579H370" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- Side service to ingress, routed upward -->
    <path class="flow" d="M595 475V402Q595 382 615 382H650Q675 382 675 357" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
    <path class="flow" d="M635 357V425Q635 448 615 448H600Q575 448 575 475" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- API to voice service and back -->
    <path class="flow" d="M1155 294H1230" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
    <path class="flow" d="M1230 341H1155" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- API to reasoning and back -->
    <path class="flow" d="M1045 430V495Q1045 519 1070 519H1230" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
    <path class="flow" d="M1230 557H1090Q1055 557 1055 535V430" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
    <!-- Future integration -->
    <path class="flow" d="M990 430V735H1195" stroke="#64748b" stroke-dasharray="7 7" marker-end="url(#arrow-violet)" opacity="0.8"/>
  </g>

  <!-- Connection labels on opaque pills -->
  <g class="mono">
    <g transform="translate(378 270)"><rect class="pill" width="80" height="25" rx="12.5"/><text x="40" y="17" text-anchor="middle" class="flow-label">HTTPS</text></g>
    <g transform="translate(753 270)"><rect class="pill" width="64" height="25" rx="12.5"/><text x="32" y="17" text-anchor="middle" class="flow-label">HTTPS</text></g>
    <g transform="translate(375 527)"><rect class="pill" width="75" height="25" rx="12.5"/><text x="37.5" y="17" text-anchor="middle" class="flow-label" fill="#ddd6fe">PAIRED</text></g>
    <g transform="translate(508 390)"><rect class="pill" width="190" height="25" rx="12.5"/><text x="95" y="17" text-anchor="middle" class="flow-label" fill="#ddd6fe">SCOPED WATCH LAN RELAY</text></g>
    <g transform="translate(1160 274)"><rect class="pill" width="66" height="25" rx="12.5"/><text x="33" y="17" text-anchor="middle" class="flow-label">AUDIO</text></g>
    <g transform="translate(1164 344)"><rect class="pill" width="61" height="25" rx="12.5"/><text x="30.5" y="17" text-anchor="middle" class="flow-label" fill="#bbf7d0">VOICE</text></g>
    <g transform="translate(1080 485)"><rect class="pill" width="142" height="25" rx="12.5"/><text x="71" y="17" text-anchor="middle" class="flow-label" fill="#ddd6fe">AUTHENTICATED</text></g>
  </g>

  <!-- Opaque current-system nodes -->
  <g filter="url(#shadow)" class="sans">
    <!-- Browser -->
    <g transform="translate(90 225)">
      <rect width="280" height="155" rx="12" fill="#081622" stroke="#22d3ee" stroke-width="1.6"/>
      <rect x="1" y="1" width="278" height="38" rx="11" fill="#0b2230"/>
      <circle cx="22" cy="20" r="4" fill="#22d3ee"/><circle cx="38" cy="20" r="4" fill="#155e75"/><circle cx="54" cy="20" r="4" fill="#155e75"/>
      <text x="20" y="70" class="node-title">Browser client</text>
      <text x="20" y="95" class="node-sub">Hold-to-Talk · Open Dialogue</text>
      <text x="20" y="116" class="node-sub">Typed text</text>
      <rect x="20" y="130" width="128" height="16" rx="8" fill="#083344"/>
      <text x="84" y="142" text-anchor="middle" fill="#67e8f9" font-size="9.5" font-weight="700">HTTPS CLIENT</text>
    </g>

    <!-- Caddy -->
    <g transform="translate(465 225)">
      <rect width="280" height="132" rx="12" fill="#0b1824" stroke="#fbbf24" stroke-width="1.6"/>
      <path d="M23 31h27M23 41h18M23 51h23" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <text x="65" y="41" class="node-title">Private LAN ingress</text>
      <text x="65" y="62" fill="#fde68a" font-size="12" font-weight="700">CADDY</text>
      <text x="20" y="91" class="node-sub">TLS termination · route controls</text>
      <text x="20" y="112" class="node-sub">No internet-facing listener</text>
    </g>

    <!-- API boundary -->
    <g transform="translate(825 225)">
      <rect width="330" height="205" rx="14" fill="#081c19" stroke="#34d399" stroke-width="1.8"/>
      <rect x="13" y="13" width="304" height="179" rx="10" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="5 5"/>
      <path d="M28 42l11-7 11 7v13c0 10-7 16-11 18-4-2-11-8-11-18z" fill="none" stroke="#fb7185" stroke-width="1.8"/>
      <text x="65" y="48" class="node-title">Jarvis API</text>
      <text x="65" y="70" fill="#fda4af" font-size="11" font-weight="750" letter-spacing=".8">SESSION + SAFETY BOUNDARY</text>
      <line x1="27" y1="91" x2="303" y2="91" stroke="#1f5147"/>
      <text x="28" y="118" class="node-sub">Session ownership and cancellation</text>
      <text x="28" y="142" class="node-sub">Input limits · response validation</text>
      <text x="28" y="166" class="node-sub">Turn-scoped audio authorization</text>
      <rect x="28" y="177" width="200" height="16" rx="8" fill="#132a27"/>
      <text x="128" y="189" text-anchor="middle" fill="#86efac" font-size="9.5" font-weight="700">EPHEMERAL TURN STATE</text>
    </g>

    <!-- Voice -->
    <g transform="translate(1230 225)">
      <rect width="280" height="180" rx="12" fill="#081d25" stroke="#22d3ee" stroke-width="1.6"/>
      <circle cx="37" cy="42" r="17" fill="#083344" stroke="#22d3ee"/>
      <path d="M37 31v15m-7-5v4a7 7 0 0 0 14 0v-4m-7 11v7m-8 0h16" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round"/>
      <text x="67" y="38" class="node-title">Local voice service</text>
      <text x="67" y="59" fill="#67e8f9" font-size="11" font-weight="700">ON-LAN PROCESSING</text>
      <rect x="20" y="84" width="112" height="48" rx="8" fill="#0b2a34" stroke="#155e75"/>
      <text x="76" y="104" text-anchor="middle" fill="#e6fbff" font-size="12" font-weight="700">WHISPER</text>
      <text x="76" y="120" text-anchor="middle" class="tiny">speech → text</text>
      <rect x="148" y="84" width="112" height="48" rx="8" fill="#0b2a34" stroke="#155e75"/>
      <text x="204" y="104" text-anchor="middle" fill="#e6fbff" font-size="12" font-weight="700">PIPER</text>
      <text x="204" y="120" text-anchor="middle" class="tiny">text → speech</text>
      <text x="20" y="158" fill="#94a3b8" font-size="11">Audio buffered only for the turn</text>
    </g>

    <!-- Watch -->
    <g transform="translate(90 475)">
      <rect width="280" height="140" rx="12" fill="#151329" stroke="#a78bfa" stroke-width="1.6"/>
      <rect x="21" y="25" width="42" height="68" rx="14" fill="#0b1020" stroke="#c4b5fd"/>
      <rect x="28" y="34" width="28" height="48" rx="8" fill="#1e1b4b"/>
      <circle cx="42" cy="88" r="2.5" fill="#a78bfa"/>
      <text x="82" y="45" class="node-title">Amazfit Active Max</text>
      <text x="82" y="67" fill="#c4b5fd" font-size="11" font-weight="700">DEVICE APP</text>
      <text x="82" y="93" class="node-sub">Voice request</text>
      <text x="82" y="114" class="node-sub">Response text + audio</text>
    </g>

    <!-- Phone side service -->
    <g transform="translate(455 475)">
      <rect width="280" height="140" rx="12" fill="#151329" stroke="#a78bfa" stroke-width="1.6"/>
      <rect x="22" y="25" width="35" height="62" rx="7" fill="#0b1020" stroke="#c4b5fd"/>
      <circle cx="39.5" cy="80" r="2" fill="#a78bfa"/>
      <text x="76" y="43" class="node-title">Zepp phone</text>
      <text x="76" y="65" fill="#c4b5fd" font-size="11" font-weight="700">SIDE SERVICE</text>
      <text x="22" y="104" class="node-sub">Paired-device bridge</text>
      <text x="22" y="124" class="node-sub">Narrowly scoped LAN relay</text>
    </g>

    <!-- Reasoning -->
    <g transform="translate(1230 475)">
      <rect width="280" height="140" rx="12" fill="#121126" stroke="#a78bfa" stroke-width="1.6"/>
      <path d="M25 39h10m8 0h10M39 25v10m0 8v10" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <circle cx="39" cy="39" r="11" fill="none" stroke="#a78bfa"/>
      <text x="70" y="42" class="node-title">Local reasoning</text>
      <text x="70" y="64" fill="#c4b5fd" font-size="11" font-weight="700">AUTHENTICATED SERVICE</text>
      <text x="22" y="96" class="node-sub">Private inference endpoint</text>
      <text x="22" y="118" class="node-sub">Validated response returns to API</text>
    </g>
  </g>

  <!-- Future integration, visually and semantically separate -->
  <g class="sans" transform="translate(820 730)">
    <rect width="690" height="104" rx="13" fill="#090f1b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 7"/>
    <rect x="18" y="-13" width="178" height="27" rx="13.5" fill="#111827" stroke="#64748b"/>
    <text x="107" y="5" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="750" letter-spacing="1">FUTURE — NOT CURRENT</text>
    <path d="M28 47h26v26H28zM34 41h14v12H34z" fill="none" stroke="#94a3b8" stroke-width="1.7"/>
    <text x="75" y="53" class="node-title" fill="#e2e8f0">Home Assistant</text>
    <text x="75" y="75" class="node-sub">Optional automation integration; no live dependency today.</text>
    <text x="508" y="58" fill="#94a3b8" font-size="11" font-weight="700">DASHED = PLANNED</text>
  </g>

  <!-- Legend outside all boundaries -->
  <g class="mono" transform="translate(60 916)">
    <text x="0" y="0" fill="#8fa3ba" font-size="10.5" font-weight="700" letter-spacing="1.4">FLOW LEGEND</text>
    <g transform="translate(0 22)"><line x1="0" y1="10" x2="42" y2="10" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/><text x="56" y="14" fill="#cbd5e1" font-size="11">request / audio</text></g>
    <g transform="translate(190 22)"><line x1="0" y1="10" x2="42" y2="10" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-emerald)"/><text x="56" y="14" fill="#cbd5e1" font-size="11">validated response</text></g>
    <g transform="translate(425 22)"><line x1="0" y1="10" x2="42" y2="10" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-violet)"/><text x="56" y="14" fill="#cbd5e1" font-size="11">paired / authenticated local hop</text></g>
    <g transform="translate(790 22)"><line x1="0" y1="10" x2="42" y2="10" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/><text x="56" y="14" fill="#cbd5e1" font-size="11">future integration</text></g>
  </g>

  <g class="sans">
    <line x1="60" y1="985" x2="1540" y2="985" stroke="#1e293b"/>
    <text x="60" y="1015" fill="#64748b" font-size="11">VOICE PRIVACY</text>
    <text x="164" y="1015" fill="#aab8c8" font-size="11">Turn-scoped processing · ephemeral audio · no public ingress</text>
    <text x="1540" y="1015" text-anchor="end" fill="#64748b" font-size="11">CURRENT PATHS SOLID · FUTURE PATHS DASHED</text>
  </g>
</svg>
